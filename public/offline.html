<!doctype html>
<html lang="ar" dir="rtl">

  <style>

    main { max-width: 420px; }

<body>
  <main>

    <p class="fr" lang="fr">Pas de connexion Internet. Vérifiez votre réseau puis réessayez.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة / Réessayer</button>
