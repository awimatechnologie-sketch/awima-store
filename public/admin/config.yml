# لوحة إدارة AWIMA Store (Sveltia CMS) — تسجيل الدخول بتوكن GitHub شخصي
backend:
  name: github
  repo: awimatechnologie-sketch/awima-store
  branch: main

locale: ar
publish_mode: simple
site_url: https://awima-store.pages.dev
display_url: https://awima-store.pages.dev
logo_url: /images/logo-icon.png

# مجلد رفع الصور الافتراضي (صور المنتجات)
media_folder: public/images/products
public_folder: /images/products

collections:
  # ---------------- المنتجات ----------------
  - name: products
    label: المنتجات
    label_singular: منتج
    folder: src/data/products
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: slug
    slug: '{{slug}}'
    summary: '{{id}} — {{name}} — {{price}}'
    sortable_fields: [id, name, price]
    fields:
      - { label: المعرّف (مثال P-0015), name: id, widget: string, pattern: ['^P-\d{4}$', 'الصيغة: P- ثم 4 أرقام، مثل P-0015 (يجب ألا يتكرر)'] }
      - { label: اسم المنتج, name: name, widget: string }
      - { label: الرابط (slug) بحروف لاتينية صغيرة وشرطات, name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'حروف لاتينية صغيرة وأرقام وشرطات فقط، مثل usb-flash-drive'] }
      - { label: وصف قصير, name: shortDescription, widget: text }
      - { label: الوصف الكامل, name: description, widget: text }
      - { label: السعر بالدرهم (اتركه فارغاً = اتصل لمعرفة السعر), name: price, widget: number, value_type: float, min: 0, required: false }
      - { label: السعر القديم قبل التخفيض (اختياري), name: oldPrice, widget: number, value_type: float, min: 0, required: false }
      - { label: العملة, name: currency, widget: hidden, default: MAD }
      - label: القسم
        name: category
        widget: relation
        collection: categories
        value_field: id
        search_fields: [name]
        display_fields: [name]
      - label: الصور (الأولى هي الرئيسية)
        name: images
        widget: list
        required: false
        hint: 'ارفع JPG أو PNG أو WebP بأي حجم؛ تُصغَّر إلى عرض 1200px وتُضغط تلقائياً عند البناء. يُفضّل صورة مربعة تقريباً بخلفية نظيفة.'
        field: { label: صورة, name: image, widget: image }
      - label: حالة التوفر
        name: availability
        widget: select
        options:
          - { label: متوفر, value: in_stock }
          - { label: غير متوفر, value: out_of_stock }
          - { label: عند الطلب, value: on_request }
        default: in_stock
      - { label: الكمية في المخزون (اتركه فارغاً = غير محدود، و0 = غير متوفر تلقائياً), name: stock, widget: number, value_type: int, min: 0, required: false, hint: 'عدّلها بعد كل بيع. تمنع السلة طلب كمية أكبر منها. إن كانت حالة التوفر «غير متوفر» فتبقى كذلك مهما كان المخزون.' }
      - { label: منتج مميز (يظهر في الرئيسية), name: featured, widget: boolean, default: false }
      - label: المواصفات التقنية
        name: specs
        widget: list
        required: false
        hint: 'أمثلة للعلب: عدد الخانات، الأبعاد، المادة، الاستعمال. وللإكسسوارات: التوافق، اللون.'
        fields:
          - { label: الاسم (مثل السعة), name: key, widget: string }
          - { label: القيمة (مثل 64 جيجابايت), name: value, widget: string }
      - label: منتجات مقترحة (يُشترى معه)
        name: related
        widget: relation
        collection: products
        value_field: id
        search_fields: [name, id]
        display_fields: [name]
        multiple: true
        required: false
        hint: 'اختياري. تظهر أسفل صفحة المنتج بترتيبك، ويُكمَل العدد تلقائياً من نفس القسم حتى 4 منتجات.'
      - label: الترجمة الفرنسية (اختيارية)
        name: fr
        widget: object
        required: false
        collapsed: true
        hint: 'ما تتركه فارغاً يظهر بالعربية في النسخة الفرنسية /fr'
        fields:
          - { label: الاسم بالفرنسية, name: name, widget: string, required: false }
          - { label: وصف قصير بالفرنسية, name: shortDescription, widget: text, required: false }
          - { label: الوصف الكامل بالفرنسية, name: description, widget: text, required: false }
          - label: المواصفات بالفرنسية
            name: specs
            widget: list
            required: false
            fields:
              - { label: الاسم (مثل Capacité), name: key, widget: string }
              - { label: القيمة (مثل 64 Go), name: value, widget: string }
      - { label: الطلب عبر واتساب, name: whatsappOrder, widget: boolean, default: true }
      - { label: إخفاء المنتج من الموقع (مسودة), name: hidden, widget: boolean, default: false, required: false, hint: 'فعّله لتجهيز منتج دون نشره، أو لإخفائه مؤقتاً دون حذفه' }

  # ---------------- الأقسام ----------------
  - name: categories
    label: الأقسام
    label_singular: قسم
    folder: src/data/categories
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: slug
    slug: '{{slug}}'
    summary: '{{order}} — {{name}}'
    fields:
      - { label: المعرّف (مثال cat-storage), name: id, widget: string, pattern: ['^cat-[a-z0-9-]+$', 'يبدأ بـ cat- ثم حروف لاتينية صغيرة، مثل cat-storage'] }
      - { label: اسم القسم, name: name, widget: string }
      - { label: اسم القسم بالفرنسية (اختياري), name: name_fr, widget: string, required: false }
      - { label: الرابط (slug), name: slug, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'حروف لاتينية صغيرة وأرقام وشرطات فقط'] }
      - { label: ترتيب الظهور (1 أولاً), name: order, widget: number, value_type: int, min: 1, default: 99 }

  # ---------------- تقييمات الزبائن ----------------
  - name: reviews
    label: تقييمات الزبائن
    label_singular: تقييم
    folder: src/data/reviews
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{product}}-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
    summary: '{{product}} — {{rating}}★ — {{buyer}} — {{author}}'
    description: 'الإطار اللوني للمنتج يُحسب تلقائياً: مشترٍ سابق موثَّق = 5 نقاط، زبون جديد = نقطة. يلزم 5 نقاط على الأقل ليظهر لون.'
    fields:
      - label: المنتج
        name: product
        widget: relation
        collection: products
        value_field: id
        search_fields: [name, id]
        display_fields: [name]
      - { label: التقييم (1 إلى 5 نجوم), name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - label: نوع المقيِّم
        name: buyer
        widget: select
        default: new
        options:
          - { label: مشترٍ سابق من المتجر (موثَّق — 5 نقاط), value: verified }
          - { label: زبون جديد (نقطة واحدة), value: new }
      - { label: اسم المقيِّم (أو الأحرف الأولى), name: author, widget: string, required: false }
      - { label: التعليق, name: comment, widget: text, required: false }
      - { label: التاريخ, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: منشور, name: published, widget: boolean, default: true, hint: 'أوقفه لإخفاء التقييم دون حذفه.' }

  # ---------------- الصفحات ----------------
  - name: pages
    label: الصفحات (من نحن / Awima Box / اتصل بنا — عربي وفرنسي)
    files:
      - label: صفحة من نحن
        name: about_page
        file: src/data/pages/about.json
        format: json
        media_folder: /public/images
        public_folder: /images
        fields:
          - { label: العنوان, name: title, widget: string }
          - { label: مقدمة, name: intro, widget: text, hint: 'سطر فارغ بين فقرتين = فقرة جديدة' }
          - { label: الرسالة, name: mission, widget: text, required: false }
          - label: الأهداف (واحد في كل سطر)
            name: goals
            widget: list
            required: false
            field: { label: هدف, name: goal, widget: string }
          - { label: الفلسفة, name: philosophy, widget: text, required: false }
          - { label: صورة (اختيارية), name: image, widget: image, required: false }
      - label: صفحة Awima Box
        name: awima_box_page
        file: src/data/pages/awima-box.json
        format: json
        fields:
          - { label: العنوان, name: title, widget: string }
          - { label: العبارة تحت العنوان, name: tagline, widget: string, required: false }
          - { label: مقدمة, name: intro, widget: text }
          - label: خطوات العمل
            name: steps
            widget: list
            required: false
            fields:
              - { label: عنوان الخطوة, name: title, widget: string }
              - { label: الشرح, name: text, widget: text, required: false }
          - label: المزايا (واحدة في كل سطر)
            name: benefits
            widget: list
            required: false
            field: { label: ميزة, name: benefit, widget: string }
          - { label: عنوان قسم المنتجات, name: productsTitle, widget: string, required: false }
          - { label: نص يظهر عند عدم وجود منتجات, name: emptyText, widget: text, required: false }
          - { label: عنوان قسم التطبيق, name: appTitle, widget: string, required: false }
          - { label: نص قسم التطبيق (اتركه فارغاً لإخفائه), name: appText, widget: text, required: false }
          - { label: رسالة واتساب الجاهزة, name: ctaText, widget: string }
      - label: صفحة اتصل بنا
        name: contact_page
        file: src/data/pages/contact.json
        format: json
        fields:
          - { label: العنوان, name: title, widget: string }
          - { label: مقدمة, name: intro, widget: text }
          - { label: ملاحظة (اختيارية), name: note, widget: text, required: false }
      - label: صفحة من نحن (الفرنسية)
        name: about_page_fr
        file: src/data/pages/about.fr.json
        format: json
        media_folder: /public/images
        public_folder: /images
        fields:
          - { label: العنوان, name: title, widget: string }
          - { label: مقدمة, name: intro, widget: text, hint: 'سطر فارغ بين فقرتين = فقرة جديدة' }
          - { label: الرسالة, name: mission, widget: text, required: false }
          - label: الأهداف (واحد في كل سطر)
            name: goals
            widget: list
            required: false
            field: { label: هدف, name: goal, widget: string }
          - { label: الفلسفة, name: philosophy, widget: text, required: false }
          - { label: صورة (اختيارية), name: image, widget: image, required: false }
      - label: صفحة Awima Box (الفرنسية)
        name: awima_box_page_fr
        file: src/data/pages/awima-box.fr.json
        format: json
        fields:
          - { label: العنوان, name: title, widget: string }
          - { label: العبارة تحت العنوان, name: tagline, widget: string, required: false }
          - { label: مقدمة, name: intro, widget: text }
          - label: خطوات العمل
            name: steps
            widget: list
            required: false
            fields:
              - { label: عنوان الخطوة, name: title, widget: string }
              - { label: الشرح, name: text, widget: text, required: false }
          - label: المزايا (واحدة في كل سطر)
            name: benefits
            widget: list
            required: false
            field: { label: ميزة, name: benefit, widget: string }
          - { label: عنوان قسم المنتجات, name: productsTitle, widget: string, required: false }
          - { label: نص يظهر عند عدم وجود منتجات, name: emptyText, widget: text, required: false }
          - { label: عنوان قسم التطبيق, name: appTitle, widget: string, required: false }
          - { label: نص قسم التطبيق (اتركه فارغاً لإخفائه), name: appText, widget: text, required: false }
          - { label: رسالة واتساب الجاهزة, name: ctaText, widget: string }
      - label: صفحة اتصل بنا (الفرنسية)
        name: contact_page_fr
        file: src/data/pages/contact.fr.json
        format: json
        fields:
          - { label: العنوان, name: title, widget: string }
          - { label: مقدمة, name: intro, widget: text }
          - { label: ملاحظة (اختيارية), name: note, widget: text, required: false }
  # ---------------- إعدادات الموقع ----------------
  - name: settings
    label: إعدادات الموقع
    files:
      - label: الهوية والتواصل والتنسيق
        name: site_settings
        file: src/data/settings.json
        format: json
        media_folder: /public/images
        public_folder: /images
        fields:
          - { label: اسم المتجر, name: name, widget: string }
          - { label: الشعار النصي (Tagline), name: tagline, widget: string }
          - { label: الشعار النصي بالفرنسية (اختياري), name: tagline_fr, widget: string, required: false }
          - { label: رابط الموقع (بدون / في النهاية), name: url, widget: string, hint: 'يُستعمل في الروابط الأساسية (canonical) وروابط واتساب' }
          - label: الشعارات
            name: logo
            widget: object
            fields:
              - { label: الشعار الكامل (الهيدر والفوتر), name: store, widget: image }
              - { label: أيقونة الشعار, name: icon, widget: image }
              - { label: صورة المشاركة على السوشيال, name: og, widget: image }
          - label: الألوان
            name: colors
            widget: object
            fields:
              - { label: اللون الأساسي, name: primary, widget: color }
              - { label: لون التمييز (الأزرار والروابط), name: accent, widget: color }
              - { label: لون التنبيه (التخفيض), name: alert, widget: color }
          - label: التواصل
            name: contact
            widget: object
            fields:
              - { label: واتساب الأساسي (دولي بدون + ولا 0، مثل 212652091799), name: whatsapp, widget: string, pattern: ['^\d{8,15}$', 'أرقام فقط بالصيغة الدولية'] }
              - { label: واتساب ثانٍ, name: whatsappSecondary, widget: string, required: false, pattern: ['^\d{8,15}$', 'أرقام فقط بالصيغة الدولية'] }
              - { label: الهاتف الأساسي (للعرض), name: phoneDisplay, widget: string, required: false }
              - { label: الهاتف الثاني (للعرض), name: phoneSecondaryDisplay, widget: string, required: false }
              - { label: البريد الإلكتروني, name: email, widget: string, required: false }
              - { label: العنوان, name: address, widget: string, required: false }
          - label: التواصل الاجتماعي
            name: social
            widget: object
            fields:
              - { label: فيسبوك (رابط كامل), name: facebook, widget: string, required: false }
              - { label: إنستغرام (رابط كامل), name: instagram, widget: string, required: false }
              - { label: تيك توك (رابط كامل), name: tiktok, widget: string, required: false }
          - label: شريط العروض أعلى الموقع
            name: announcements
            widget: list
            required: false
            hint: 'تظهر العروض المفعّلة فقط، وإن وُجد أكثر من عرض تتناوب كل 5 ثوانٍ'
            fields:
              - { label: نص العرض, name: text, widget: string }
              - { label: نص العرض بالفرنسية (اختياري), name: text_fr, widget: string, required: false }
              - { label: رابط عند الضغط (اختياري، مثل /products), name: link, widget: string, required: false }
              - { label: مفعّل, name: enabled, widget: boolean, default: true }
          - label: أوقات العمل (بتوقيت المغرب)
            name: hours
            widget: object
            fields:
              - { label: وقت الفتح (مثل 10:00), name: open, widget: string, pattern: ['^([01]?\d|2[0-4]):[0-5]\d$', 'الصيغة HH:MM مثل 10:00'] }
              - { label: وقت الإغلاق (24:00 = منتصف الليل), name: close, widget: string, pattern: ['^([01]?\d|2[0-4]):[0-5]\d$', 'الصيغة HH:MM مثل 24:00'] }
          - label: التوصيل السريع (يظهر في السلة)
            name: fastDelivery
            widget: object
            fields:
              - { label: الحد الأدنى لعدد المنتجات, name: minItems, widget: number, value_type: int, min: 1, default: 4 }
              - { label: مدة التوصيل بالساعات (أقل من), name: hours, widget: number, value_type: int, min: 1, default: 5 }
          - { label: التوصيل مجاني ابتداءً من (درهم — اتركه فارغاً أو 0 للتعطيل), name: freeDeliveryFrom, widget: number, value_type: float, min: 0, required: false }
          - label: أكواد الخصم
            name: discounts
            widget: list
            required: false
            hint: 'الكود يُطبَّق على مجموع المنتجات فقط (لا على التوصيل). لا يظهر الكود نفسه في كود الصفحة، لكن راجع كل طلب يحمل كوداً قبل تأكيده. التواريخ بتوقيت المغرب وتشمل اليومين.'
            summary: '{{fields.code}} — {{fields.value}} {{fields.type}}'
            fields:
              - { label: الكود (حروف لاتينية وأرقام، 3–24), name: code, widget: string, pattern: ['^[A-Za-z0-9_-]{3,24}$', 'حروف لاتينية وأرقام وشرطات فقط (3 إلى 24)'] }
              - label: نوع الخصم
                name: type
                widget: select
                default: percent
                options:
                  - { label: نسبة مئوية %, value: percent }
                  - { label: مبلغ ثابت بالدرهم, value: fixed }
              - { label: القيمة (نسبة 1–100 أو مبلغ), name: value, widget: number, value_type: float, min: 1 }
              - { label: أدنى مجموع منتجات (اختياري), name: minSubtotal, widget: number, value_type: float, min: 0, required: false }
              - { label: يبدأ في (اختياري), name: startDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
              - { label: ينتهي في (اختياري، يشمل هذا اليوم), name: endDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
              - { label: مفعّل, name: enabled, widget: boolean, default: true }
          - label: المدن
            name: cities
            widget: list
            required: false
            hint: 'المدن غير المفعّلة تظهر مقفلة 🔒 ولا يمكن الطلب منها. فعّل المدينة عند بدء العمل فيها، وحدّد رسم التوصيل لها.'
            fields:
              - { label: اسم المدينة, name: name, widget: string }
              - { label: اسم المدينة بالفرنسية (اختياري), name: name_fr, widget: string, required: false }
              - { label: مفتوحة للطلب, name: open, widget: boolean, default: false }
              - { label: رسم التوصيل بالدرهم (يُضاف إلى مجموع الطلب), name: fee, widget: number, value_type: float, min: 0, default: 30 }
          - label: الإحصائيات (Cloudflare Web Analytics)
            name: analytics
            widget: object
            required: false
            hint: 'بلا كوكيز. الصق توكن الموقع من Cloudflare ← Web Analytics ← Manage site (32 خانة). اتركه فارغاً لتعطيل الإحصائيات. لا تفعّله هنا إن كنت فعّلت Web Analytics من إعدادات مشروع Pages نفسه (لا حاجة للاثنين).'
            fields:
              - { label: توكن Cloudflare, name: cloudflareToken, widget: string, required: false, pattern: ['^[a-fA-F0-9]{32}$', '32 خانة من الأرقام وحروف a-f فقط'] }
          - label: متقدم — CSS مخصص
            name: customCss
            widget: text
            required: false
            hint: 'تحذير: خطأ هنا قد يكسر التصميم. للتراجع امسح المحتوى واحفظ. قد تحتاج !important لتجاوز تنسيقات الموقع.'
