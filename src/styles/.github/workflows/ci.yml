# فحص كل Pull Request (وكل push إلى main): فحص البيانات ثم بناء الموقع كاملاً.
# يلتقط أخطاء لوحة الإدارة (معرّف مكرر، صورة مفقودة...) قبل أن يفشل بناء Cloudflare.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
